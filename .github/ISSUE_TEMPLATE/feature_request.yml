name: Feature request
description: Suggest a focused improvement.
body:
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: What would you like to accomplish?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe device and host behavior, including compatibility constraints.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
