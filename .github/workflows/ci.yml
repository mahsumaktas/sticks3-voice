name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: Host checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: python tools/check.py
      - name: Verify generated assets
        if: runner.os == 'Linux'
        run: |
          python tools/build_assets.py
          python tools/render_previews.py
          git diff --exit-code -- firmware/main/assets assets/previews

  security:
    name: Dependency and secret checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Audit locked Python dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit -r requirements-dev.txt --disable-pip --no-deps --progress-spinner off
      - name: Scan source and complete Git history
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --output gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  gitleaks.tar.gz\n' "$GITLEAKS_SHA256" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks" dir . --redact --no-banner
          "$RUNNER_TEMP/gitleaks" git . --redact --no-banner

  firmware:
    name: Firmware (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        language: [en, tr]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Choose device language
        env:
          UI_LANGUAGE: ${{ matrix.language }}
        run: |
          if [ "$UI_LANGUAGE" = tr ]; then
            printf 'CONFIG_STICKS3_UI_TURKISH=y\n' > firmware/sdkconfig.language
          else
            printf '# CONFIG_STICKS3_UI_TURKISH is not set\n' > firmware/sdkconfig.language
          fi
      - uses: espressif/esp-idf-ci-action@e6f5c74232b1ccd4c97ed641f1e48553853f1fd5 # v1.2.0
        with:
          esp_idf_version: v5.4
          target: esp32s3
          path: firmware
          command: idf.py -D 'SDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.language' build
      - name: Verify dependency lock stayed fixed
        run: git diff --exit-code -- firmware/dependencies.lock
